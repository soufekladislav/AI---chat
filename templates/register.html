{% extends 'auth_base.html' %}{% block title %}Registrace · Fresh AI Chat{% endblock %}{% block content %}<h1>Vytvoř si účet</h1><p class="intro">Použij účet Fresh Crackers i pro ukládání historie svého Chatu.</p>{% if error %}<div class="notice error">{{ error }}</div>{% endif %}<form method="post"><input type="hidden" name="csrf" value="{{ csrf_token() }}"><label for="email">E-mail</label><input id="email" name="email" type="email" autocomplete="email" required value="{{ email|default('') }}"><label for="pass">Heslo <small>(alespoň 10 znaků)</small></label><input id="pass" name="password" type="password" autocomplete="new-password" minlength="10" required><label for="confirm">Potvrzení hesla</label><input id="confirm" name="password_confirm" type="password" autocomplete="new-password" minlength="10" required><label class="check"><input type="checkbox" onchange="for(const id of ['pass','confirm'])document.getElementById(id).type=this.checked?'text':'password'"> <span>Zobrazit hesla</span></label><label class="check"><input type="checkbox" name="privacy" value="1" required> <span>Seznámil/a jsem se se <a href="{{ privacy_url }}" target="_blank" rel="noopener">zásadami ochrany osobních údajů ↗</a>.</span></label><button class="primary" type="submit">Pokračovat</button></form><p class="bottom">Už máš účet? <a href="/account/login">Přihlásit se</a></p>{% endblock %}
